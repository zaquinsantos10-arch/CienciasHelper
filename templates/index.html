<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CiênciasHelper</title>
  <style>
    :root {
      --fundo: #eef5f1; --painel: #ffffff; --texto: #1d2b25;
      --verde: #2e7d5b; --balao-bot: #e8efeb; --borda: #c5d0ca; --erro: #fde2e2;
    }
    :root[data-tema="escuro"] {
      --fundo: #0f1714; --painel: #17211d; --texto: #e3ece7;
      --verde: #3a9d73; --balao-bot: #233029; --borda: #34443c; --erro: #4a2323;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, sans-serif;
      background: var(--fundo); color: var(--texto);
      display: flex; justify-content: center;
    }
    main {
      width: 100%; max-width: 720px; height: 100vh;
      display: flex; flex-direction: column; background: var(--painel);
    }
    header {
      padding: 16px 20px; background: var(--verde); color: #fff;
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    header h1 { margin: 0; font-size: 1.3rem; }
    header p { margin: 4px 0 0; font-size: .85rem; opacity: .85; }
    .acoes { display: flex; gap: 6px; }
    .acoes button { padding: 6px 10px; background: rgba(255,255,255,.2); font-size: .85rem; }
    #conversa { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 85%; padding: 10px 14px; border-radius: 14px; line-height: 1.45; white-space: pre-wrap; }
    .msg img { display: block; max-width: 100%; max-height: 220px; border-radius: 8px; margin-bottom: 6px; }
    .user { align-self: flex-end; background: var(--verde); color: #fff; }
    .bot { align-self: flex-start; background: var(--balao-bot); }
    .erro { background: var(--erro); }

    #previa { display: none; padding: 8px 12px 0; align-items: center; gap: 8px; font-size: .85rem; }
    #previa img { height: 56px; border-radius: 8px; border: 1px solid var(--borda); }
    #previa button { background: transparent; color: var(--texto); padding: 4px 8px; border: 1px solid var(--borda); }

    form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--borda); }
    input[type="text"] {
      flex: 1; min-width: 0; padding: 12px; border: 1px solid var(--borda); border-radius: 10px;
      font-size: 1rem; background: var(--painel); color: var(--texto);
    }
    button { padding: 0 20px; border: 0; border-radius: 10px; background: var(--verde); color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: wait; }
    .icone {
      padding: 0 12px; background: var(--balao-bot); color: var(--texto);
      border: 1px solid var(--borda); font-size: 1.2rem;
    }
    .icone.gravando { background: #d94040; color: #fff; }
  </style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>🔬 CiênciasHelper</h1>
      <p>Tire suas dúvidas de biologia, física, química e mais</p>
    </div>
    <div class="acoes">
      <button id="limpar" type="button" title="Limpar conversa">🗑️ Limpar</button>
      <button id="tema" type="button" title="Trocar tema">🌙</button>
    </div>
  </header>

  <div id="conversa"></div>

  <div id="previa">
    <img id="previa-img" alt="Imagem escolhida">
    <span>Imagem pronta para enviar</span>
    <button id="tirar-imagem" type="button">✕ Remover</button>
  </div>

  <form id="form">
    <input id="arquivo" type="file" accept="image/*" hidden>
    <button id="anexar" class="icone" type="button" title="Enviar uma imagem">📎</button>
    <button id="mic" class="icone" type="button" title="Perguntar por voz">🎤</button>
    <input id="campo" type="text" placeholder="Digite ou fale sua pergunta..." autocomplete="off">
    <button id="botao">Enviar</button>
  </form>
</main>

<script>
  const conversa = document.getElementById("conversa");
  const form = document.getElementById("form");
  const campo = document.getElementById("campo");
  const botao = document.getElementById("botao");
  const botaoLimpar = document.getElementById("limpar");
  const botaoTema = document.getElementById("tema");
  const botaoMic = document.getElementById("mic");
  const botaoAnexar = document.getElementById("anexar");
  const inputArquivo = document.getElementById("arquivo");
  const previa = document.getElementById("previa");
  const previaImg = document.getElementById("previa-img");
  const raiz = document.documentElement;

  const BOAS_VINDAS = 'Oi! Eu sou o CiênciasHelper. Pergunte qualquer coisa de ciências, por texto, por voz (🎤) ou mandando uma imagem (📎). Exemplo: "por que o céu é azul?"';
  let historico = [];
  let imagemAtual = null; // imagem escolhida, em base64

  // ---------- tema claro/escuro ----------
  function aplicarTema(tema) {
    raiz.dataset.tema = tema;
    botaoTema.textContent = tema === "escuro" ? "☀️" : "🌙";
  }

  let temaSalvo = null;
  try { temaSalvo = localStorage.getItem("tema"); } catch (e) {}
  const prefereEscuro = window.matchMedia("(prefers-color-scheme: dark)").matches;
  aplicarTema(temaSalvo || (prefereEscuro ? "escuro" : "claro"));

  botaoTema.addEventListener("click", () => {
    const novo = raiz.dataset.tema === "escuro" ? "claro" : "escuro";
    aplicarTema(novo);
    try { localStorage.setItem("tema", novo); } catch (e) {}
  });

  // ---------- pergunta por voz ----------
  const Reconhecimento = window.SpeechRecognition || window.webkitSpeechRecognition;
  let reconhecedor = null;
  let gravando = false;

  if (!Reconhecimento) {
    botaoMic.style.display = "none"; // navegador sem suporte (ex: Firefox)
  } else {
    reconhecedor = new Reconhecimento();
    reconhecedor.lang = "pt-BR";
    reconhecedor.interimResults = true;

    reconhecedor.onresult = (e) => {
      campo.value = Array.from(e.results).map((r) => r[0].transcript).join("");
    };
    reconhecedor.onend = () => {
      gravando = false;
      botaoMic.classList.remove("gravando");
      campo.focus();
    };
    reconhecedor.onerror = (e) => {
      if (e.error === "not-allowed" || e.error === "service-not-allowed") {
        alert("Preciso da permissão do microfone. Libere no cadeado ao lado do endereço do site.");
      }
    };

    botaoMic.addEventListener("click", () => {
      if (gravando) {
        reconhecedor.stop();
        return;
      }
      campo.value = "";
      gravando = true;
      botaoMic.classList.add("gravando");
      try { reconhecedor.start(); } catch (e) {}
    });
  }

  // ---------- envio de imagem ----------
  // reduz a foto antes de mandar, pra não pesar e passar do limite do servidor
  function reduzirImagem(arquivo) {
    return new Promise((resolve, reject) => {
      const leitor = new FileReader();
      leitor.onerror = () => reject(new Error("Não consegui ler a imagem."));
      leitor.onload = () => {
        const img = new Image();
        img.onerror = () => reject(new Error("Esse arquivo não parece ser uma imagem."));
        img.onload = () => {
          const MAX = 1024;
          const escala = Math.min(1, MAX / Math.max(img.width, img.height));
          const canvas = document.createElement("canvas");
          canvas.width = Math.round(img.width * escala);
          canvas.height = Math.round(img.height * escala);
          canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
          resolve(canvas.toDataURL("image/jpeg", 0.85));
        };
        img.src = leitor.result;
      };
      leitor.readAsDataURL(arquivo);
    });
  }

  function tirarImagem() {
    imagemAtual = null;
    inputArquivo.value = "";
    previa.style.display = "none";
  }

  botaoAnexar.addEventListener("click", () => inputArquivo.click());
  document.getElementById("tirar-imagem").addEventListener("click", tirarImagem);

  inputArquivo.addEventListener("change", async () => {
    const arquivo = inputArquivo.files[0];
    if (!arquivo) return;
    try {
      imagemAtual = await reduzirImagem(arquivo);
      previaImg.src = imagemAtual;
      previa.style.display = "flex";
    } catch (err) {
      alert(err.message);
      tirarImagem();
    }
  });

  // ---------- conversa ----------
  function adicionar(texto, classe, imagem) {
    const div = document.createElement("div");
    div.className = "msg " + classe;
    if (imagem) {
      const img = document.createElement("img");
      img.src = imagem;
      div.appendChild(img);
    }
    div.appendChild(document.createTextNode(texto));
    conversa.appendChild(div);
    conversa.scrollTop = conversa.scrollHeight;
    return div;
  }

  function limparConversa() {
    historico = [];
    conversa.innerHTML = "";
    tirarImagem();
    adicionar(BOAS_VINDAS, "bot");
    campo.focus();
  }

  botaoLimpar.addEventListener("click", limparConversa);
  limparConversa();

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    if (gravando) reconhecedor.stop();

    let pergunta = campo.value.trim();
    if (!pergunta && !imagemAtual) return;
    if (!pergunta) pergunta = "Explique o que aparece nesta imagem.";

    const imagem = imagemAtual;
    adicionar(pergunta, "user", imagem);
    historico.push({ role: "user", content: pergunta });
    campo.value = "";
    tirarImagem();
    botao.disabled = true;
    botaoLimpar.disabled = true;
    const balao = adicionar("Pensando...", "bot");

    try {
      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensagens: historico, imagem: imagem }),
      });

      if (!r.ok) {
        const dados = await r.json().catch(() => ({}));
        throw new Error(dados.erro || "Algo deu errado.");
      }

      // lê a resposta aos poucos e vai montando o texto
      const leitor = r.body.getReader();
      const decoder = new TextDecoder();
      let texto = "";
      while (true) {
        const { done, value } = await leitor.read();
        if (done) break;
        texto += decoder.decode(value, { stream: true });
        balao.textContent = texto;
        conversa.scrollTop = conversa.scrollHeight;
      }

      historico.push({ role: "assistant", content: texto });
    } catch (err) {
      balao.textContent = err.message;
      balao.classList.add("erro");
      historico.pop(); // tira a pergunta que falhou
    }

    botao.disabled = false;
    botaoLimpar.disabled = false;
    campo.focus();
  });
</script>
</body>
</html>
